name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        env:
          # Optional: add a TMDB_API_KEY repository secret to ship the live catalog built in.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ClaudeTV.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ClaudeTV-apk
          path: ClaudeTV.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ClaudeTV.apk \
            --title "Claude TV (latest build #${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Install on your Google TV: see README." \
            --target ${{ github.sha }}
